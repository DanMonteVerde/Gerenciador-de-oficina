{% load static %}

<link rel="stylesheet" href="{% static 'css/base.css' %}" />
<link rel="stylesheet" href="{% static 'css/main/style.css' %}" />
<link rel="stylesheet" href="{% static 'css/main/menu.css' %}" />
<link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />

<header>
    <div id="imagem-header">
        <i
            class="bi bi-wrench"
            style="
                font-size: 30px;
                background-color: #1e40af;
                padding: 5px;
                border-radius: 12px;
                color: white;
                width: 40px;
                text-align: center;
            "
        ></i>
        <div>
            <h1 style="color: #1e40af" class="texto-azul">AutoGest Pro</h1>
            <h2 
                class="text-muted"
                style="font-size: 20px; margin-top: -7px"
            >Sistema de gestão de oficina</h2>
        </div>
    </div>

    <div id="user-logado">
        <div id="caixa-logado">
            <div class="profile-pic" id="button-logout">
                <span class="initials"></span>
            </div>

            <span id="cargo-user" style="color: #000000">
                Administrador
                <span id="name-user" style="color: #000000">
                    Administrador
                </span>
            </span>
        </div>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" id="botao-sair">
                <i
                    class="fa-solid fa-arrow-right-from-bracket"
                    style="color: #000000; font-size: 15px"
                ></i>
            </button>
        </form>
    </div>
</header>
