{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS -->
        <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
            integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="{% static 'css/veiculos/cadastro_veiculo.css' %}">
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // se estiver editando e já existir cliente selecionado
                
                const clienteSelect = document.getElementById("id_cliente");
                const veiculoSelect = document.getElementById("id_veiculo");
                
                if (clienteSelect.value) {
                    clienteSelect.dispatchEvent(new Event('change'));
                }
                // segurança: se o form não existir, não quebra a página
                if (!clienteSelect || !veiculoSelect) {
                    return;
                }

                clienteSelect.addEventListener("change", function () {

                    const clienteId = this.value;

                    // limpa o select de veículos
                    veiculoSelect.innerHTML = '<option value="">Selecione um veículo</option>';

                    if (!clienteId) {
                        return;
                    }

                    fetch("{% url 'carregar_veiculos' %}?cliente=" + clienteId)
                        .then(response => response.json())
                        .then(data => {

                            data.forEach(veiculo => {
                                const option = document.createElement("option");
                                option.value = veiculo.id;
                                option.textContent = veiculo.marca_modelo + " - " + veiculo.placa;
                                veiculoSelect.appendChild(option);
                            });

                        })
                        .catch(error => {
                            console.error("Erro ao carregar veículos:", error);
                        });
                });

            });
            </script>

    </head>
    <body style="background-color: #cdcdcd">
        <div
            class="container mt-5"
            style="background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); max-width: 600px;"
        >
            <h2 style="text-align: center; margin-bottom: 50px">
                Cadastro de Serviços
            </h2>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    {{form.as_p}}
                </div>
                {% block botao %}
                <div style="display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                    <button type="reset" class="btn btn-danger">Limpar</button>
                    <a href="{% url 'servicos' %}"> <button type="button" class="btn btn-secondary">Voltar</button></a>
                </div>
                {% endblock %}
            </form>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"
        ></script>
        <!-- nao tirar daqui e nao mudar a ordem -->
        <script>
            $(document).ready(function () {

                const clienteSelect = $('#id_cliente');
                const veiculoSelect = $('#id_veiculo');

                function carregarVeiculos(clienteId, veiculoSelecionado = null) {
                    veiculoSelect.html('<option value="">Selecione um veículo</option>');

                    if (!clienteId) return;

                    $.ajax({
                        url: "{% url 'ajax_carregar_veiculos' %}",
                        data: {
                            cliente_id: clienteId
                        },
                        success: function (data) {
                            data.forEach(function (veiculo) {
                                let selected = veiculo.id == veiculoSelecionado ? 'selected' : '';
                                veiculoSelect.append(
                                    `<option value="${veiculo.id}" ${selected}>
                                        ${veiculo.marca_modelo} - ${veiculo.placa}
                                    </option>`
                                );
                            });
                        },
                        error: function () {
                            console.error('Erro ao carregar veículos');
                        }
                    });
                }

                // 🔹 quando troca o cliente
                clienteSelect.on('change', function () {
                    carregarVeiculos($(this).val());
                });

                // 🔹 quando está editando (carrega automático)
                const clienteInicial = clienteSelect.val();
                const veiculoInicial = veiculoSelect.val();

                if (clienteInicial) {
                    carregarVeiculos(clienteInicial, veiculoInicial);
                }

            });
        </script>


    </body>
</html>
